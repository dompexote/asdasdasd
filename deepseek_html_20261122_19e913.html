<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucidrift · press start to remember</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0618;
  --card:#171034;
  --card2:#1e1548;
  --ink:#f0eaff;
  --mute:#9a90c9;
  --a:#7cf5e1;    /* cyan neon  */
  --b:#ff7ad9;    /* pink neon  */
  --c:#9b8cff;    /* purple     */
  --g:#b9ff7c;    /* green      */
  --line:#2f2370;
  --pixel:'Press Start 2P', monospace;
  --mono:'VT323', monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 85% -10%, #b967ff22, transparent),
    radial-gradient(900px 500px at 0% 40%, #01cdfe14, transparent),
    radial-gradient(700px 400px at 100% 80%, #ff71ce12, transparent),
    var(--bg);
  color:var(--ink);
  font:16px/1.55 'Trebuchet MS','Segoe UI',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
/* scanlines CRT */
body::after{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:99;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
  opacity:.35;
}
svg{width:1.1em;height:1.1em;fill:currentColor;vertical-align:-.15em}
a{color:inherit}
.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}

/* ---------- HEADER ---------- */
header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:10;
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  padding:14px 5vw;
  background:linear-gradient(180deg,#0a0618f2,#0a0618e6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  box-shadow:0 0 24px #7cf5e11a;
}
.logo{
  font-family:var(--pixel);
  font-size:13px;
  letter-spacing:.06em;
  text-decoration:none;
  color:var(--a);
  text-shadow:0 0 12px var(--a), 2px 2px 0 var(--b);
}
.logo i{color:var(--b);font-style:normal;text-shadow:0 0 10px var(--b)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a,.btn{
  display:inline-flex;gap:8px;align-items:center;
  padding:8px 16px;
  text-decoration:none;border:0;cursor:pointer;
  font:700 14px inherit;font-family:inherit;
  color:var(--ink);
  background:var(--card);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  transition:all .2s;
}
nav a:hover{background:var(--card2);color:var(--a)}
nav a.on,.btn.p{
  background:linear-gradient(120deg,var(--c),var(--b));
  color:#15092f;
  box-shadow:0 0 22px #9b8cff55, 0 0 8px #ff7ad966;
}
.btn.m{background:var(--a);color:#06241f;box-shadow:0 0 18px #7cf5e155}
.soc{display:flex;gap:6px;align-items:center}
.soc a,.soc button{
  width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  background:var(--card);color:var(--a);border:1px solid var(--line);
  cursor:pointer;text-decoration:none;transition:all .2s;
}
.soc a:hover,.soc button:hover{color:var(--b);border-color:var(--b);box-shadow:0 0 16px #ff7ad966}

/* ---------- BANDAS ---------- */
.band{overflow:hidden;opacity:.55;margin:0;padding:8px 0;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.band div{display:inline-block;animation:mv 60s linear infinite}
.band.r div{animation-direction:reverse}
.band span{display:inline-block;margin:0 6px;padding:4px 14px;border-radius:4px 14px 4px 14px;font-size:13px;font-weight:700;color:#10062a}
@keyframes mv{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.band div{animation:none}}

/* ---------- MAIN ---------- */
main{max-width:1040px;margin:0 auto;padding:30px 5vw 60px;position:relative;z-index:2}
h1{
  font-family:var(--pixel);
  font-size:clamp(18px,4.5vw,34px);
  line-height:1.35;
  letter-spacing:.02em;
  margin:.4em 0 .3em;
  background:linear-gradient(90deg,var(--a),var(--c) 40%,var(--b));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px #9b8cff66);
}
h2{
  font-family:var(--pixel);
  font-size:12px;
  line-height:1.6;
  margin:2em 0 .6em;
  color:var(--a);
  letter-spacing:.04em;
  text-shadow:2px 2px 0 #ff7ad966, 0 0 16px #7cf5e188;
}
.mute{color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);padding:22px}
.ph{aspect-ratio:16/9;width:100%;border:0;background:#000;box-shadow:0 0 30px #9b8cff33}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.sup{display:grid;gap:18px;grid-template-columns:1fr auto;align-items:center}
.cup{
  width:120px;height:120px;display:grid;place-items:center;
  border-radius:50% 50% 50% 8px;
  background:linear-gradient(135deg,var(--b),var(--c));
  color:#15092f;font-size:56px;
  box-shadow:0 0 30px #ff7ad955;
  animation:float 4s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-6px)}}

/* ---------- GRID PERSONAGENS ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.ch{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  padding:12px;
  display:flex;flex-direction:column;gap:8px;
  transition:all .25s;
}
.ch:hover{
  border-color:var(--a);
  background:var(--card2);
  box-shadow:0 0 22px #7cf5e133, 0 0 8px #ff7ad926;
  transform:translateY(-2px);
}
.av{
  aspect-ratio:1;display:grid;place-items:center;
  font:800 40px Georgia,serif;color:#fff;
  text-shadow:0 2px 8px #0008;
  border-radius:6px 30px 6px 30px;
  position:relative;overflow:hidden;
  border:1px solid #7cf5e133;
  box-shadow:inset 0 0 24px #0006, 0 0 14px #7cf5e122;
}
.av>img,.av>svg{width:100%;height:100%;object-fit:cover;display:block}
.cam{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.cam label,.cam button{
  background:#0a0618cc;color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700;
  font-family:inherit;cursor:pointer;
}
.cam button:hover{color:var(--b);border-color:var(--b)}
.gi{position:absolute;right:0;top:0;height:100%;aspect-ratio:1}
.gi img,.gi svg{width:100%;height:100%;object-fit:cover;display:block}
.gal>b,.gal>small{position:relative}
.ch b{line-height:1.2;font-size:14px}
.ch small{color:var(--mute);font-size:12px}
.vt{
  margin-top:auto;display:flex;justify-content:space-between;align-items:center;
  background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:6px 10px;cursor:pointer;border-radius:20px;font:inherit;
  transition:all .2s;
}
.vt:hover{border-color:var(--b);color:var(--b)}
.vt.on{background:var(--b);color:#2a0820;border-color:var(--b);box-shadow:0 0 16px #ff7ad966}

/* ---------- INPUTS ---------- */
input,textarea,select{
  width:100%;padding:10px 12px;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;font:inherit;
  outline:none;transition:border-color .2s;
}
input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 12px #7cf5e133}
textarea{min-height:120px;font:13px/1.4 'VT323',ui-monospace,Menlo,monospace;font-size:15px}
.tools{display:grid;gap:10px;grid-template-columns:1fr 160px 110px}
@media(max-width:620px){.tools,.sup{grid-template-columns:1fr}.cup{display:none}}

/* ---------- FILA ---------- */
.q{display:flex;gap:14px;align-items:center;padding:10px 14px;margin:8px 0}
.q .n{font:800 24px 'Press Start 2P',monospace;color:var(--b);width:40px;text-shadow:0 0 12px var(--b)}
.q.d{opacity:.45;text-decoration:line-through}
.mix{display:block;text-decoration:none;padding:16px;background:var(--card);border-left:4px solid var(--a);transition:all .2s}
.mix:hover{border-color:var(--b);box-shadow:0 0 20px #ff7ad933}

/* ---------- FOOTER ---------- */
footer{text-align:center;color:var(--mute);font-size:13px;padding:30px 5vw;position:relative;z-index:2}

/* ---------- EDITOR ---------- */
#ed{position:fixed;inset:0;z-index:20;background:#05020fdd;display:none;overflow:auto;padding:4vw;backdrop-filter:blur(6px)}
#ed.open{display:block}
#ed .box{max-width:720px;margin:auto;display:grid;gap:10px;border:1px solid var(--a);box-shadow:0 0 40px #7cf5e155}
label{font-size:13px;color:var(--mute)}
.hid{display:none}
</style>
</head>

try{Object.assign(C,JSON.parse(localStorage.getItem("lr_cfg")||"{}"))}catch(e){}
try{Object.assign(S,JSON.parse(localStorage.getItem("lr_st")||"{}"))}catch(e){}

const tabs=[["music","Music"],["suggest","Sugerir"],["queue","Fila"],["gallery","Galeria"]];

function head(){
  const v=(location.hash||"#music").slice(1);
  $("nav").innerHTML=tabs.map(t=>`<a href="#${t[0]}" class="${v===t[0]?"on":""}">${t[1]}</a>`).join("");

  <div class="row"><a class="btn p" href="${safeUrl(C.yt)}" target="_blank" rel="noopener"><svg><use href="#yt"/></svg>Inscreva-se no YouTube</a><a class="btn" href="${safeUrl(C.sp)}" target="_blank" rel="noopener"><svg><use href="#sp"/></svg>Spotify</a></div>
  <h2>gostando das mixes?</h2>
  <div class="box cut sup"><div><p>um café é sempre bem-vindo, nunca obrigatório.<br>toda mix aqui é gratuita, com ou sem café. se uma delas te fez companhia, essa é uma forma bonita de agradecer.</p><a class="btn m" href="${safeUrl(C.kf)}" target="_blank" rel="noopener"><svg><use href="#kf"/></svg>Apoiar no Ko-fi</a></div><div class="cup"><svg style="width:56px;height:56px"><use href="#kf"/></svg></div></div>
  <h2>últimas mixes</h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${mixes.length?mixes.map(m=>`<a class="mix cut" href="${safeUrl(m[1]||C.yt)}" target="_blank" rel="noopener">▶ ${esc(m[0])}</a>`).join(""):`<a class="mix cut" href="${safeUrl(C.yt)}" target="_blank" rel="noopener">▶ Veja todas as mixes no canal<br><small class="mute">use o botão ✎ para adicionar títulos e links das mixes aqui</small></a>`}</div>`;
}

let q="",dec="",srt="y";
function suggest(){
  return `<h1>Sugerir</h1><p class="mute">vote nas personagens que você quer ouvir em uma próxima mix. sua sugestão não está na lista? adicione.</p>
  <div class="tools"><input id="q" placeholder="buscar personagem ou série" value="${esc(q)}" oninput="q=this.value;list()"><select onchange="dec=this.value;list()"><option value="">todas as épocas</option>${["1990","2000","2010","2020"].map(d=>`<option value="${d}" ${dec===d?"selected":""}>anos ${d.slice(2)}${d==="2020"?" (2020–26)":"s"}</option>`).join("")}</select><select onchange="srt=this.value;list()"><option value="y">por ano</option><option value="v" ${srt==="v"?"selected":""}>mais votadas</option><option value="a" ${srt==="a"?"selected":""}>A–Z</option></select></div>
  <div class="row"><input id="nn" placeholder="nome" style="flex:1;min-width:140px"><input id="ns" placeholder="anime ou jogo" style="flex:1;min-width:140px"><button class="btn p" onclick="addC()">Adicionar sugestão</button></div>
  <div class="grid" id="g"></div>`;
}

function list(){
  let L=chars().filter(c=>(c.n+c.s).toLowerCase().includes(q.toLowerCase())&&(!dec||(c.y>=dec&&c.y<+dec+10)));
  L.sort(srt==="v"?(a,b)=>(S.votes[b.n]||0)-(S.votes[a.n]||0):srt==="a"?(a,b)=>a.n.localeCompare(b.n):(a,b)=>(a.y||9999)-(b.y||9999));
  $("g").innerHTML=L.map(c=>`<div class="ch cut"><div class="av" style="background:${grad(c.n)}">${art(c.n)}<span class="cam"><label title="enviar imagem">foto<input type="file" accept="image/*" data-up="${esc(c.n)}" class="hid"></label>${S.img[c.n]?`<button data-rm="${esc(c.n)}" title="remover imagem">×</button>`:""}</span></div><b>${esc(c.n)}</b><small>${esc(c.s)}${c.y?" · "+c.y:""}</small><button class="vt ${S.mine[c.n]?"on":""}" data-n="${esc(c.n)}"><span><svg><use href="#ht"/></svg> votar</span><b>${S.votes[c.n]||0}</b></button></div>`).join("")||`<p class="mute">nada encontrado.</p>`;
  document.querySelectorAll(".vt").forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(S.mine[n]){S.mine[n]=0;S.votes[n]=Math.max(0,(S.votes[n]||1)-1)}else{S.mine[n]=1;S.votes[n]=(S.votes[n]||0)+1}saveS();list()});
  document.querySelectorAll("[data-up]").forEach(i=>i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(im.width,im.height);c.width=c.height=240;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);S.img[i.dataset.up]=c.toDataURL("image/jpeg",.8);saveS();list()};im.src=r.result};r.readAsDataURL(f)});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{delete S.img[b.dataset.rm];saveS();list()});
}

function addC(){const n=$("nn").value.trim(),s=$("ns").value.trim();if(!n)return;S.custom.push([n,s,""]);S.mine[n]=1;S.votes[n]=1;saveS();$("nn").value=$("ns").value="";head();list()}

function queue(){
  const L=chars().filter(c=>S.votes[c.n]>0).sort((a,b)=>S.votes[b.n]-S.votes[a.n]);
  return `<h1>Fila</h1><p class="mute">as personagens mais votadas neste navegador. marque como feita quando a mix sair.</p>`+(L.length?L.map((c,i)=>`<div class="q box cut ${S.done[c.n]?"d":""}"><span class="n">${String(i+1).padStart(2,'0')}</span><div class="av" style="width:48px;background:${grad(c.n)}">${art(c.n)}</div><div style="flex:1"><b>${esc(c.n)}</b><br><small class="mute">${esc(c.s)}</small></div><b>♥ ${S.votes[c.n]}</b><button class="btn" data-d="${esc(c.n)}">${S.done[c.n]?"desfazer":"feita"}</button></div>`).join(""):`<div class="box cut">a fila está vazia. vá em <a href="#suggest">Sugerir</a> e vote.</div>`);
}

function gallery(){
  return `<h1>Galeria</h1><p class="mute">capas em estilo lucid drift das personagens da lista.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${chars().map(c=>`<div class="cut gal" style="aspect-ratio:16/9;background:${grad(c.n)};padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;text-shadow:0 2px 8px #0009;position:relative;overflow:hidden"><span class="gi">${art(c.n)}</span><b style="font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5">${esc(c.n)}</b><small>${esc(c.s)}</small></div>`).join("")}</div>`;
}

function draw(){
  const v=(location.hash||"#music").slice(1);
  $("app").innerHTML=({suggest,queue,gallery}[v]||music)();
  head();
  if(v==="suggest")list();
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.done[b.dataset.d]=!S.done[b.dataset.d];saveS();draw()});
  window.scrollTo(0,0);
}

function openEd(){
  const f=(k,l)=>`<label>${l}<input data-k="${k}" value="${esc(C[k])}"></label>`;
  const t=(k,l,h)=>`<label>${l}<textarea data-k="${k}" ${h?`style="min-height:${h}px"`:''}>${esc(C[k])}</textarea></label>`;
  $("edbox").innerHTML=`<h2 style="margin:0">⚙ Editar site</h2><p class="mute" style="margin:0">as alterações ficam salvas neste navegador. use Exportar para guardar um backup e Importar para restaurar.</p>
  ${f("tag","frase principal")}${f("sub","subfrase")}${f("yt","link do YouTube")}${f("sp","link do Spotify")}${f("kf","link do Ko-fi")}${f("pl","ID da playlist de uploads do YouTube")}
  ${t("mixes","últimas mixes (uma por linha: Título | link)")}${t("chars","personagens (uma por linha: Nome | Série | Ano)",300)}
  <div class="row"><button class="btn p" onclick="saveEd()">Salvar</button><button class="btn" onclick="exp()">Exportar</button><button class="btn" onclick="$('imp').click()">Importar</button><button class="btn" onclick="rst()">Restaurar padrão</button><button class="btn" onclick="$('ed').classList.remove('open')">Fechar</button></div><input type="file" id="imp" accept=".json" class="hid">`;
  $("imp").onchange=e=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);C={...DEF,...(o.cfg||{})};S={...S,...(o.state||{})};saveC();saveS();$("ed").classList.remove("open");draw()}catch(x){alert("arquivo inválido")}};r.readAsText(e.target.files[0])};
  $("ed").classList.add("open");
}
function saveEd(){document.querySelectorAll("#edbox [data-k]").forEach(i=>C[i.dataset.k]=i.value);saveC();$("ed").classList.remove("open");draw()}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg:C,state:S},null,1)],{type:"application/json"}));a.download="lucidrift-backup.json";a.click()}
function rst(){if(confirm("Restaurar todo o conteúdo padrão?")){C={...DEF};saveC();$("ed").classList.remove("open");draw()}}

addEventListener("hashchange",draw);draw();
</script>
</body>
</html>
